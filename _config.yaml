# =============================================================
#  RIVER — site configuration
#  Bilingual convention: English / Indonesian
#  Titles and headings use the pattern "English / Indonesian".
#  The template splits on " / " and renders both halves.
# =============================================================

title: "RIVER"
subtitle: "Universitas Brawijaya"
show-title: false
show-subtitle: false
description: "RIVER — Water Quality and Environment Research | Teknik Pengairan Universitas Brawijaya"
header: images/background.jpg
footer: images/background.jpg
proofer: false
timezone: Asia/Jakarta
future: true

# site social media and other links
# (delete any you don't use — the footer only renders the ones with a value)
links:
  email: hello@example.org
  home-page: https://pengairan.ub.ac.id/
  instagram: https://www.instagram.com/river.idn/
  external: https://f-arriel.github.io/river-website/admin/
  

### jekyll settings

# front matter defaults
defaults:
  # all markdown files
  - scope:
      path: ""
    values:
      layout: default
  # markdown files in /_members
  - scope:
      type: "members"
    values:
      layout: member
  # markdown files in /_posts
  - scope:
      type: "posts"
    values:
      layout: post

collections:
  # generate page for each member
  members:
    output: true
  # generate page for each post
  posts:
    output: true
  gallery:
    output: false
  themes:
    output: false
  employment:
    output: false
  outreach:
    output: false

# jekyll plugins
plugins:
  - jekyll-spaceship
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-feed
  - jekyll-last-modified-at

# code block syntax highlighting
highlighter: rouge

# jekyll theme
theme: null

# sass settings
sass:
  sass_dir: _styles

# force jekyll to include certain files/folders
include:
  - _styles
  - _scripts
  # copied into _site so the deployed gh-pages branch tells GitHub not to run
  # its own Jekyll over the already-built site (which would drop /_styles)
  - .nojekyll

# force jekyll to exclude certain files/folders
exclude:
  - README.md
  - LICENSE.md
  - CITATION.cff
  - DEPLOY.md
  - CMS-SETUP.md

# configure jekyll spaceship
jekyll-spaceship:
  mathjax-processor:
    src:
      - https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js
