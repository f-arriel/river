# maps a "type" to its default icon, label and link template.
# _includes/button.html looks up site.data.types[type] for every button on the
# site: footer links, member profile links, publication badges, alerts.
#
# HOW THE `link:` TEMPLATE WORKS
#   If an entry has a `link:` containing $VALUE, whatever you write in
#   _config.yaml or a member's front matter is substituted into it.
#     github:  link: "https://github.com/$VALUE"   ->  write just: f-arriel
#   If an entry has NO `link:`, your value is used as-is.
#     instagram: (no link template)               ->  write the full URL
#   Getting this backwards produces a doubled URL like
#   https://github.com/https://github.com/f-arriel, so check before adding.

# ---------------------------------------------------------------
# team member roles
# ---------------------------------------------------------------

principal-investigator:
  icon: "fa-solid fa-microscope"
  description: "Principal Investigator / Ketua Peneliti"

postdoc:
  icon: "fa-solid fa-glasses"
  description: "Postdoctoral Researcher / Peneliti Pascadoktoral"

research-staff:
  icon: "fa-solid fa-flask"
  description: "Research Staff / Staf Peneliti"

phd:
  icon: "fa-solid fa-graduation-cap"
  description: "PhD Student / Mahasiswa Doktoral"

master:
  icon: "fa-solid fa-user-graduate"
  description: "Master's Student / Mahasiswa Magister"

undergrad:
  icon: "fa-solid fa-book-open"
  description: "Undergraduate Student / Mahasiswa Sarjana"

alumni:
  icon: "fa-solid fa-user-check"
  description: "Alumni / Alumni"

# ---------------------------------------------------------------
# general links — these take a FULL URL, except email and phone
# ---------------------------------------------------------------

link:
  icon: "fa-solid fa-globe"
  text: "Link / Tautan"
  tooltip: "Link / Tautan"

website:
  icon: "fa-solid fa-globe"
  text: "Website / Situs Web"
  tooltip: "Website / Situs Web"

external:
  icon: "fa-solid fa-up-right-from-square"
  text: "External link / Tautan eksternal"
  tooltip: "External link / Tautan eksternal"

home-page:
  icon: "fa-solid fa-house-user"
  text: "Home page / Beranda"
  tooltip: "Home page / Beranda"

email:
  icon: "fa-solid fa-envelope"
  text: "Email"
  tooltip: "Email"
  link: "mailto:$VALUE"

phone:
  icon: "fa-solid fa-phone"
  text: "Phone / Telepon"
  tooltip: "Phone number / Nomor telepon"
  link: "tel:$VALUE"

address:
  icon: "fa-solid fa-map-location-dot"
  text: "Address / Alamat"
  tooltip: "Address / Alamat"

search:
  icon: "fa-solid fa-magnifying-glass"
  text: "Search / Cari"
  tooltip: "Search / Cari"

# ---------------------------------------------------------------
# social media — FULL URL (no link template)
# ---------------------------------------------------------------

instagram:
  icon: "fa-brands fa-instagram"
  text: "Instagram"
  tooltip: "Instagram"

linkedin:
  icon: "fa-brands fa-linkedin"
  text: "LinkedIn"
  tooltip: "LinkedIn"

# ---------------------------------------------------------------
# academic profiles — write the BARE ID / USERNAME, not a full URL
# ---------------------------------------------------------------

orcid:
  icon: "fa-brands fa-orcid"
  text: "ORCID"
  tooltip: "ORCID"
  link: "https://orcid.org/$VALUE"

google-scholar:
  icon: "fa-brands fa-google"
  text: "Google Scholar"
  tooltip: "Google Scholar"
  link: "https://scholar.google.com/citations?user=$VALUE"

researchgate:
  icon: "fa-brands fa-researchgate"
  text: "ResearchGate"
  tooltip: "ResearchGate"
  link: "https://www.researchgate.net/profile/$VALUE"

github:
  icon: "fa-brands fa-github"
  text: "GitHub"
  tooltip: "GitHub"
  link: "https://github.com/$VALUE"

twitter:
  icon: "fa-brands fa-twitter"
  text: "Twitter"
  tooltip: "Twitter"
  link: "https://twitter.com/$VALUE"

youtube:
  icon: "fa-brands fa-youtube"
  text: "YouTube"
  tooltip: "YouTube"
  link: "https://youtube.com/$VALUE"

